name: Bug report
description: Something in Datanotes does not work as the docs say.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. A small reproduction helps us fix it fast.

        **Do not paste private data.** This issue is public. Never include your real notes,
        your `settings.json`, an owner or named token, or anything else from your vault.
        Make a minimal reproduction with invented data instead.

        A security problem goes through [SECURITY.md](https://github.com/davidefornelli/datanotes/blob/main/SECURITY.md), never an issue.
  - type: input
    id: version
    attributes:
      label: Datanotes version
      description: The output of `datanotes --version`.
      placeholder: 3.0.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: The system and its version.
      placeholder: Windows 11 24H2, macOS 15.5, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: The output of `node --version`.
      placeholder: v24.16.0
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead. Include the full error, with its `hint` and `docs`.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: |
        The fewest steps that show the bug, on a new vault with invented data: the operations
        you called with their arguments, or a small `metastore.yaml` and notes.
      render: text
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Logs, how often it happens, what you already tried. Remove tokens and private paths first.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This issue contains no real notes, no `settings.json` and no token.
          required: true
